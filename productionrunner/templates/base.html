<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ProductionRunner{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body><header><a class="brand" href="{{ url_for('index') }}">PR <span>ProductionRunner</span></a>{% if g.user %}<div class="identity">{% if g.tenant %}{{ g.tenant.name }} · {% endif %}{{ g.user.username }} · {{ g.roles | join(', ') }}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="secondary">Sign out</button></form></div>{% endif %}</header><main>{% block content %}{% endblock %}</main><footer>Provisional MVP · PR v1.9 reconciliation pending · Keep the JobRunner with the material.</footer></body></html>
