{% set delivery=fulfillment_for(ticket) %}<section class="card"><h2>Delivery: {{ delivery.status }}</h2><p>Ordered {{ ticket.quantity }} · Accepted {{ delivery.accepted }} · Packed {{ delivery.packed }} · Departed {{ delivery.departed }} · Remaining {{ delivery.remaining }}</p><a class="button secondary" href="{{ url_for('delivery_detail',ticket_id=ticket.id) }}">Packing, ERP checkpoints &amp; departure</a></section>
