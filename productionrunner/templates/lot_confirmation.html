{% if unit is defined and unit and lot_info(unit.id) %}<label>Confirm {{ 'inspected' if lot_inspection|default(false) else 'completed good' }} quantity for this lot<input type="number" name="{{ 'inspected_quantity' if lot_inspection|default(false) else 'completed_quantity' }}" min="{{ lot_quantity(unit.id) }}" max="{{ lot_quantity(unit.id) }}" required></label><p>Expected: {{ lot_quantity(unit.id) }} units. Split partial quantities before confirming; hold discrepancies separately.</p>{% endif %}
