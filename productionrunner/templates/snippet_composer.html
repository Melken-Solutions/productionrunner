<div class="snippet-composer" data-snippet-composer><label>Choose a message<select name="snippet_id" required><option value="">Select a predefined message</option><optgroup label="Built-in messages">{% for s in snippets if s.builtin %}<option value="{{ s.key }}" data-body="{{ s.body }}">{{ s.title }}</option>{% endfor %}</optgroup>{% set custom=snippets|rejectattr('builtin')|list %}{% if custom %}<optgroup label="Your organization">{% for s in custom %}<option value="{{ s.key }}" data-body="{{ s.body }}">{{ s.title }}</option>{% endfor %}</optgroup>{% endif %}<option value="other">Other / type a note</option></select></label><div class="snippet-preview" data-snippet-preview role="status" aria-live="polite">Choose a message above. No typing is needed for predefined messages.</div><div data-snippet-note hidden><label>Your message<textarea name="note" maxlength="1800" rows="3" disabled></textarea></label></div></div><script src="{{ url_for('static',filename='snippet_composer.js') }}" defer></script>
