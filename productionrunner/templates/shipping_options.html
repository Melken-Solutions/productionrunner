<label>Production purpose<select name="purpose">{% for value,label in [('stock','Make to stock'),('order','Make to order')] %}<option value="{{ value }}" {% if defaults and defaults.purpose==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Shipping method<select name="method">{% for value,label in [('fedex','FedEx parcel'),('ltl','LTL pallet')] %}<option value="{{ value }}" {% if defaults and defaults.method==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Who supplies shipping labels?<select name="label_owner">{% for value,label in [('planner','Planner'),('packing','Packing staff'),('either','Planner or packing staff')] %}<option value="{{ value }}" {% if defaults and defaults.label_owner==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
