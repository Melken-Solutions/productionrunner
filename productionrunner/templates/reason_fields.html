<div class="stack reason-choice"><label>Reason<select name="reason_choice" {% if reason_required|default(true) %}required{% endif %}><option value="">Choose reason</option>{% for option in reason_groups[reason_group|default('change')]+['Other'] %}{% set value=(reason_group|default('change'))~':'~option %}<option value="{{ value }}" {% if request.form.get('reason_choice')==value %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><details class="reason-details"><summary>Additional details <span data-reason-hint>(optional)</span></summary><label>Details · maximum 400 characters<textarea name="reason_notes" maxlength="400" rows="2" placeholder="Add only details needed to explain this change.">{{ request.form.get('reason_notes','') }}</textarea></label></details></div>
