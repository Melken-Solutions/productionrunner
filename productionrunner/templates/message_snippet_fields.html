<label>Short title<input name="title" value="{{ snippet.title|default('') }}" required maxlength="80" placeholder="Material damaged"></label><label>Message to send<textarea name="body" required maxlength="1800" rows="3">{{ snippet.body|default('') }}</textarea></label><label>Category<select name="category" required><option value="">Choose category</option>{% for category in categories %}<option {% if snippet.category|default('')==category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label><label>Available for<select name="usage">{% for value,label in [('both','Requests and replies'),('request','New requests'),('reply','Replies')] %}<option value="{{ value }}" {% if snippet.usage|default('both')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Status<select name="active"><option value="1" {% if snippet.active|default(1)==1 %}selected{% endif %}>Active</option><option value="0" {% if snippet.active|default(1)==0 %}selected{% endif %}>Disabled</option></select></label>{% with reason_group='change',reason_required=true %}{% include 'reason_fields.html' %}{% endwith %}
